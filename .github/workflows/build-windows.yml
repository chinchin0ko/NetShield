name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build CLI
        # El CLI (Dart puro) se compila a un .exe nativo y se deja junto a
        # la app para que el instalador lo incluya.
        run: dart compile exe bin/netshield.dart -o build/windows/x64/runner/Release/netshield.exe

      - name: Build NetShield service
        # El servidor Dart (netshield-server.exe) se compila a un .exe
        # nativo y se deja en build\service\ para que el instalador lo
        # incluya (ver windows/installer/netshield.iss). Lo lanza el
        # wrapper en C (netshield-service.exe). dart compile no crea el
        # directorio de salida solo, así que se crea antes.
        run: |
          New-Item -ItemType Directory -Force -Path build\service | Out-Null
          dart compile exe bin/netshield_service.dart -o build\service\netshield-server.exe

      - name: Setup MSVC
        # El wrapper en C del servicio se compila con cl.exe; este paso
        # pone el toolchain de Visual Studio en el PATH.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build NetShield service wrapper
        # El wrapper nativo en C (netshield-service.exe) es el binario
        # que registra el SCM; lanza netshield-server.exe --console
        # como hijo (ver windows/service/netshield_service_wrapper.c).
        # El servicio Dart no puede correr como servicio real: su
        # ServiceMain usa Pointer.fromFunction, que el SCM no puede
        # invocar (crash 0xc0000409). Ver windows-service/SERVICE_CRASH.md.
        run: cl.exe /nologo /O2 /W3 /Fe:build\service\netshield-service.exe windows\service\netshield_service_wrapper.c advapi32.lib

      - name: Download WireGuard installer
        # El instalador de NetShield incluye el MSI oficial de WireGuard
        # para instalarlo en silencio (ver windows/installer/netshield.iss).
        run: |
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi" -OutFile "windows\installer\wireguard-amd64-1.1.1.msi"
          Get-ChildItem windows\installer\wireguard-amd64-1.1.1.msi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\netshield.iss
          Get-ChildItem windows\installer-output\

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: netshield-windows-installer
          path: app/windows/installer-output/netshield-setup-*.exe
